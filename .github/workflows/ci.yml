name: CI

on:
  push:
    branches: ['main']
  pull_request:
    branches: ['main']

env:
    SLDS_PACKAGES_AUTH_TOKEN: ${{ secrets.SLDS_PACKAGES_AUTH_TOKEN }}

jobs:
  app:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [angular-demo, lit-demo, svelte-demo, vue-demo]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies
        run: yarn install --no-immutable

      - name: Lint
        run: yarn workspace ${{ matrix.app }} lint

      - name: Build
        run: yarn workspace ${{ matrix.app }} build
