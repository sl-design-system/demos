<div class="states">
  <sl-form-field
    label="Enabled search field"
    hint="This example uses reactive forms."
  >
    <sl-search-field
      [formControl]="searchControl"
      placeholder="Search"
    ></sl-search-field>
  </sl-form-field>

  <sl-form-field label="Disabled search field">
    <sl-search-field
      [formControl]="disabledSearchControl"
      placeholder="Search"
    ></sl-search-field>
  </sl-form-field>
</div>
