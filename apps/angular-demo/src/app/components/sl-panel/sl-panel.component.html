<sl-panel collapsible>
  <span slot="header">Panel Title</span>
  <sl-button slot="aside actions" tooltip="Pinata" fill="ghost"><sl-icon name="pinata"></sl-icon></sl-button>
  <sl-button slot="aside" tooltip="Smile" fill="ghost"><sl-icon name="face-smile"></sl-icon></sl-button>
  <sl-button slot="aside" tooltip="Warning" fill="ghost" (click)="openBlankPage()"><sl-icon name="triangle-exclamation-solid"></sl-icon></sl-button>

  <sl-badge slot="suffix" emphasis="subtle" size="lg" variant="info">suffix</sl-badge>
  <span>Collapsible panel content</span>
</sl-panel>
